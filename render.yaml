services:
  - type: web
    name: birthday-page
    runtime: node
    plan: free
    buildCommand: npm ci && RENDER_NODE_SERVER=true npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
